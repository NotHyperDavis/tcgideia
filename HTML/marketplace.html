<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
    <link rel="icon" type="image/png" href="../assets/icons/favicon-32.png">
    <link rel="apple-touch-icon" href="../assets/icons/favicon-180.png">
    <title>Marketplace - TCGMarketPortugal</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/marketplace.css">

</head>
<body>

    <header class="navbar">
        <a href="main.html" class="logo"><h2>TCGMarketPortugal</h2></a>
        <nav>
            <a href="marketplace.html">Marketplace</a>
            <a href="sell.html">Vender</a>
            <a href="login.html">Entrar</a>
        </nav>
    </header>

    <section class="marketplace">

    <aside class="filters">

        <h2>Filtros</h2>

        <h3>Jogo</h3>

        <label><input type="checkbox" checked disabled> Pokémon</label>
        <label class="filter-disabled"><input type="checkbox" disabled> One Piece <small>(brevemente)</small></label>
        <label class="filter-disabled"><input type="checkbox" disabled> Yu-Gi-Oh! <small>(brevemente)</small></label>
        <label class="filter-disabled"><input type="checkbox" disabled> Magic <small>(brevemente)</small></label>

        <h3>Condição</h3>

        <label><input type="checkbox" class="condition-filter" value="mint"> Mint</label>
        <label><input type="checkbox" class="condition-filter" value="near_mint"> Near Mint</label>
        <label><input type="checkbox" class="condition-filter" value="excellent"> Excelente</label>
        <label><input type="checkbox" class="condition-filter" value="good"> Boa</label>
        <label><input type="checkbox" class="condition-filter" value="played"> Usada</label>
        <label><input type="checkbox" class="condition-filter" value="poor"> Danificada</label>

    </aside>

    <main class="results">

        <h2>Marketplace</h2>

        <input
            type="text"
            id="searchInput"
            placeholder="🔍 Pesquisar pelo nome da carta..."
            class="marketplace-search"
        >

        <div class="cards" id="marketCards">

        </div>

    </main>

</section>

<footer class="site-footer">
    <p>&copy; 2026 TCGMarketPortugal <span class="footer-divider">·</span> <a href="termos.html">Termos de Uso</a> <span class="footer-divider">·</span> <a href="privacidade.html">Privacidade</a> <span class="footer-divider">·</span> <a href="reembolsos.html">Reembolsos</a></p>
</footer>

<script src="../js/config.js"></script>
<script src="../js/marketplace.js"></script>
<script src="../js/auth-nav.js"></script>

</body>
</html>
