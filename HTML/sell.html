<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
    <link rel="icon" type="image/png" href="../assets/icons/favicon-32.png">
    <link rel="apple-touch-icon" href="../assets/icons/favicon-180.png">
    <title>Vender Carta - TCGMarketPortugal</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/app.css">
</head>
<body>

<header class="navbar">

    <a href="main.html" class="logo">
        TCGMarketPortugal
    </a>

    <nav>

        <a href="marketplace.html">
            Marketplace
        </a>

        <a href="sell.html">
            Vender
        </a>

        <a href="login.html">
            Entrar
        </a>

    </nav>

</header>


<main class="page">

    <h1>Vender uma Carta</h1>
    <p style="font-size:13px;"><a href="bulk-upload.html">Tens muitas cartas para vender? Publica várias de uma vez →</a></p>

    <div id="loginWarning" style="display:none;">
        <p>Precisas de <a href="login.html">iniciar sessão</a> para poderes vender cartas.</p>
    </div>

    <div id="sellFlow">

        <label for="gameSelect">Jogo</label>
        <select id="gameSelect">
            <option value="pokemon">Pokémon</option>
            <option value="yugioh">Yu-Gi-Oh!</option>
            <option value="magic">Magic: The Gathering</option>
            <option value="onepiece">One Piece</option>
        </select>

        <input
            type="text"
            id="searchCard"
            placeholder="Pesquisar carta pelo nome..."
        >

        <button onclick="searchCard()">
            Pesquisar
        </button>

        <div id="results" class="cards"></div>

        <form id="listingForm" style="display:none;">

            <div id="selectedCardPreview"></div>

            <label for="price">Preço (€)</label>
            <input type="number" id="price" step="0.01" min="0.01" required>

            <label for="condition">Condição</label>
            <select id="condition" required>
                <option value="mint">Mint</option>
                <option value="near_mint">Near Mint</option>
                <option value="excellent">Excelente</option>
                <option value="good">Boa</option>
                <option value="played">Usada</option>
                <option value="poor">Danificada</option>
            </select>

            <label for="quantity">Quantidade</label>
            <input type="number" id="quantity" min="1" value="1" required>

            <label for="language">Idioma da carta</label>
            <select id="language" required>
                <option value="EN">Inglês</option>
                <option value="PT">Português</option>
                <option value="ES">Espanhol</option>
                <option value="FR">Francês</option>
                <option value="DE">Alemão</option>
                <option value="IT">Italiano</option>
                <option value="JP">Japonês</option>
                <option value="KO">Coreano</option>
                <option value="ZH">Chinês</option>
            </select>

            <label style="display:flex; align-items:center; gap:8px; font-weight:normal;">
                <input type="checkbox" id="isFoil" style="width:auto;">
                Foil / Holo
            </label>

            <label for="description">Descrição (opcional)</label>
            <textarea id="description" placeholder="Ex: sem marcas, guardada em bicho"></textarea>

            <label for="realPhoto">Foto real da carta (opcional, mas recomendado)</label>
            <input type="file" id="realPhoto" accept="image/*">
            <div id="realPhotoPreview"></div>

            <button type="submit">Publicar anúncio</button>

        </form>

        <p id="message"></p>

    </div>

</main>

<script src="../js/config.js"></script>
<script src="../js/auth-nav.js"></script>
<script src="../js/sell.js"></script>

<footer class="site-footer">
    <p>&copy; 2026 TCGMarketPortugal <span class="footer-divider">·</span> <a href="termos.html">Termos de Uso</a> <span class="footer-divider">·</span> <a href="privacidade.html">Privacidade</a> <span class="footer-divider">·</span> <a href="reembolsos.html">Reembolsos</a></p>
</footer>

</body>
</html>
