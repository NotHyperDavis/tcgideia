    <nav class="user-nav">

</header>

    <section class="marketplace">

    <aside class="filters">

        <h2>Filtros</h2>

        <h3>Jogo</h3>

        <label><input type="checkbox" class="game-filter" value="pokemon"> Pokémon</label>
        <label><input type="checkbox" class="game-filter" value="onepiece"> One Piece</label>
        <label><input type="checkbox" class="game-filter" value="yugioh"> Yu-Gi-Oh!</label>
        <label><input type="checkbox" class="game-filter" value="magic"> Magic</label>

        <h3>Condição</h3>

        <label><input type="checkbox" class="condition-filter" value="near_mint"> Near Mint</label>
        <label><input type="checkbox" class="condition-filter" value="excellent"> Excelente</label>
        <label><input type="checkbox" class="condition-filter" value="good"> Boa</label>
        <label><input type="checkbox" class="condition-filter" value="played"> Usada</label>
        <label><input type="checkbox" class="condition-filter" value="poor"> Danificada</label>

        <h3>Idioma</h3>

        <label><input type="checkbox" class="language-filter" value="PT"> Português</label>
        <label><input type="checkbox" class="language-filter" value="EN"> Inglês</label>
        <label><input type="checkbox" class="language-filter" value="ES"> Espanhol</label>
        <label><input type="checkbox" class="language-filter" value="JP"> Japonês</label>

        <h3>Variante</h3>

        <label><input type="checkbox" class="variant-filter" value="foil"> Só Foil</label>
        <label><input type="checkbox" class="variant-filter" value="holo"> Só Holo</label>
        <label><input type="checkbox" class="variant-filter" value="reverse_holo"> Só Reverse Holo</label>

        <h3>Expansão/Coleção</h3>

        <input type="text" id="setFilter" placeholder="Ex: Scarlet & Violet..." class="marketplace-search">

    </aside>

    <main class="results">

        <h2>Marketplace</h2>

        <input
            type="text"
            id="searchInput"
            placeholder="🔍 Pesquisar pelo nome da carta..."
            class="marketplace-search"
        >

        <select id="sortSelect" class="marketplace-search" style="max-width:220px;">
            <option value="">Ordenar por...</option>
            <option value="price_asc">Preço: menor → maior</option>
            <option value="price_desc">Preço: maior → menor</option>
        </select>

        <div class="cards" id="marketCards">

        </div>

    </main>

</section>
