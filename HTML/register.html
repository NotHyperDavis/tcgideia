<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
    <link rel="icon" type="image/png" href="/assets/icons/favicon-32.png">
    <link rel="apple-touch-icon" href="/assets/icons/favicon-180.png">
    <title>Criar Conta - TCGMarketPortugal</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/footer.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<script src="/js/config.js"></script>
<script src="/js/auth-nav.js"></script>
<body>

    <header class="navbar">
        <a href="main.html" class="logo"><h2>TCGMarketPortugal</h2></a>
        <nav>
            <a href="marketplace.html">Marketplace</a>
            <a href="sell.html">Vender</a>
            <a href="login.html">Entrar</a>
        </nav>
    </header>

    <main class="auth-container">
        <h2>Criar Conta</h2>

        <form id="registerForm">
            <label for="name">Nome</label>
            <input type="text" id="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" required minlength="6">

            <label style="display:flex; align-items:flex-start; gap:8px; font-weight:normal; font-size:13px; margin-top:12px;">
                <input type="checkbox" id="termsAccepted" style="width:auto; margin-top:3px;" required>
                <span>Li e aceito os <a href="termos.html" target="_blank">Termos de Uso</a> e a <a href="privacidade.html" target="_blank">Política de Privacidade</a>.</span>
            </label>

            <button type="submit">Registar</button>
        </form>

        <p id="message"></p>

        <p>Já tens conta? <a href="login.html">Entra aqui</a></p>
    </main>

    <script src="/js/register.js"></script>

  

<footer class="site-footer">
    <p>&copy; 2026 TCGMarketPortugal <span class="footer-divider">·</span> <a href="termos.html">Termos de Uso</a> <span class="footer-divider">·</span> <a href="privacidade.html">Privacidade</a> <span class="footer-divider">·</span> <a href="reembolsos.html">Reembolsos</a></p>
</footer>

</body>
</html>
